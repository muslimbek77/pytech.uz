<VirtualHost *:80>
    ServerName career.pytech.uz
    DocumentRoot /var/www/career-platform

    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory /var/www/certbot/.well-known/acme-challenge>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/career-platform>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://career.pytech.uz%{REQUEST_URI} [R=301,L,NE]

    ErrorLog ${APACHE_LOG_DIR}/career.pytech.uz-error.log
    CustomLog ${APACHE_LOG_DIR}/career.pytech.uz-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName career.pytech.uz
    DocumentRoot /var/www/career-platform

    <Directory /var/www/career-platform>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/career.pytech.uz/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/career.pytech.uz/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    ErrorLog ${APACHE_LOG_DIR}/career.pytech.uz-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/career.pytech.uz-ssl-access.log combined
</VirtualHost>
</IfModule>
